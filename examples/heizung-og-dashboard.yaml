# Heizung OG mit Heizplaner-Karte – Raw-Konfigurationseditor -> alles ersetzen
title: Heizung OG
views:
- title: Heizung OG
  path: heizung-og
  icon: mdi:radiator
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: custom:heizplaner-card
      title: Heizplaner
      grid_options:
        columns: full
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Raumtemperaturen · TIMMERFLOTTE
      icon: mdi:home-thermometer-outline
    - type: tile
      entity: sensor.wohnzimmer_timmerflotte_wohnzimmer_temperatur
      name: Wohnzimmer
      icon: mdi:thermometer
      color: orange
      features_position: bottom
      features:
      - type: trend-graph
        hours_to_show: 24
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.esszimmer_timmerflotte_esszimmer_temperatur
      name: Esszimmer
      icon: mdi:thermometer
      color: orange
      features_position: bottom
      features:
      - type: trend-graph
        hours_to_show: 24
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.schlafzimmer_timmerflotte_schlafzimmer_temperatur
      name: Schlafzimmer
      icon: mdi:thermometer
      color: orange
      features_position: bottom
      features:
      - type: trend-graph
        hours_to_show: 24
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.buro_timmerflotte_buro_temperatur
      name: Büro
      icon: mdi:thermometer
      color: orange
      features_position: bottom
      features:
      - type: trend-graph
        hours_to_show: 24
      grid_options:
        columns: 6
    - type: history-graph
      title: Temperatur (24 h)
      hours_to_show: 24
      grid_options:
        columns: full
      entities:
      - entity: sensor.wohnzimmer_timmerflotte_wohnzimmer_temperatur
        name: Wohnzimmer
      - entity: sensor.esszimmer_timmerflotte_esszimmer_temperatur
        name: Esszimmer
      - entity: sensor.schlafzimmer_timmerflotte_schlafzimmer_temperatur
        name: Schlafzimmer
      - entity: sensor.buro_timmerflotte_buro_temperatur
        name: Büro
    - type: history-graph
      title: Luftfeuchte (24 h)
      hours_to_show: 24
      grid_options:
        columns: full
      entities:
      - entity: sensor.wohnzimmer_timmerflotte_wohnzimmer_luftfeuchtigkeit
        name: Wohnzimmer
      - entity: sensor.esszimmer_timmerflotte_esszimmer_luftfeuchtigkeit
        name: Esszimmer
      - entity: sensor.schlafzimmer_timmerflotte_schlafzimmer_luftfeuchtigkeit
        name: Schlafzimmer
      - entity: sensor.buro_timmerflotte_buro_luftfeuchtigkeit
        name: Büro
