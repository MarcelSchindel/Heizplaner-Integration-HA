name: Prüfung

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # description/topics/license werden in den Repo-Einstellungen gesetzt –
          # danach diese drei hier wieder entfernen
          ignore: brands description topics license

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest ruff
      - run: ruff check --select E,F,W,B,UP --ignore E501 custom_components/heizplaner
      - run: pytest -q tests
      - run: node --check custom_components/heizplaner/frontend/heizplaner-card.js
