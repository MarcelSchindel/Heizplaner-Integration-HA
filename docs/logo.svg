<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA726"/>
      <stop offset="1" stop-color="#F4511E"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE9DC"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7A1E00" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <!-- Heizkörper -->
  <g filter="url(#sh)">
    <rect x="92" y="150" width="280" height="22" rx="11" fill="#FFFFFF"/>
    <rect x="92" y="352" width="280" height="22" rx="11" fill="#FFFFFF"/>
    <g fill="url(#fin)">
      <rect x="104" y="126" width="40" height="272" rx="20"/>
      <rect x="160" y="126" width="40" height="272" rx="20"/>
      <rect x="216" y="126" width="40" height="272" rx="20"/>
      <rect x="272" y="126" width="40" height="272" rx="20"/>
      <rect x="328" y="126" width="40" height="272" rx="20"/>
    </g>
    <rect x="132" y="398" width="16" height="30" rx="6" fill="#FFFFFF"/>
    <rect x="316" y="398" width="16" height="30" rx="6" fill="#FFFFFF"/>
  </g>
  <!-- Uhr -->
  <g filter="url(#sh)">
    <circle cx="372" cy="356" r="92" fill="#1E3A5F"/>
    <circle cx="372" cy="356" r="72" fill="#FFFFFF"/>
    <g stroke="#1E3A5F" stroke-width="7" stroke-linecap="round">
      <line x1="372" y1="296" x2="372" y2="306"/>
      <line x1="432" y1="356" x2="422" y2="356"/>
      <line x1="372" y1="416" x2="372" y2="406"/>
      <line x1="312" y1="356" x2="322" y2="356"/>
    </g>
    <line x1="372" y1="356" x2="372" y2="314" stroke="#1E3A5F" stroke-width="12" stroke-linecap="round"/>
    <line x1="372" y1="356" x2="404" y2="376" stroke="#F4511E" stroke-width="12" stroke-linecap="round"/>
    <circle cx="372" cy="356" r="9" fill="#1E3A5F"/>
